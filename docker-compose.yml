services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MODELDOCK_API_AUTH_ENABLED: ${MODELDOCK_API_AUTH_ENABLED:-false}
      MODELDOCK_ADMIN_API_KEY: ${MODELDOCK_ADMIN_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_MODELDOCK_API_KEY: ${NEXT_PUBLIC_MODELDOCK_API_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modeldock
      POSTGRES_USER: modeldock
      POSTGRES_PASSWORD: modeldock
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modeldock -d modeldock"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
