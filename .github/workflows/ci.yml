name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: modeldock
          POSTGRES_USER: modeldock
          POSTGRES_PASSWORD: modeldock
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U modeldock -d modeldock"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      MODELDOCK_DATABASE_URL: postgresql+psycopg://modeldock:modeldock@localhost:5432/modeldock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest-cov

      - name: Check dependency consistency
        working-directory: backend
        run: pip check

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build --pull

      - name: Start services
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Verify backend API surface
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/docs > /dev/null

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "Frontend is reachable."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs frontend
          exit 1

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down services
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
